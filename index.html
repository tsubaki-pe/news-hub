<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="世界・日本・投資・AI・教育の最新ニュースをまとめて読めるRSSニュースハブ" />
    <title>世界ニュース母艦</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div>
        <p class="eyebrow">Daily RSS Intelligence</p>
        <h1>世界ニュース母艦</h1>
        <p class="tagline">重要な動きを、ひとつの場所で。</p>
      </div>
      <div class="header-meta">
        <p class="updated" id="updated">更新を確認中</p>
        <p class="feed-health" id="feed-health"></p>
      </div>
    </header>

    <div class="toolbar">
      <nav class="tabs" id="tabs" aria-label="ニュースカテゴリ" role="tablist"></nav>
      <label class="search">
        <span class="visually-hidden">ニュースを検索</span>
        <input id="search" type="search" placeholder="見出し・媒体・要約を検索" autocomplete="off" />
      </label>
    </div>

    <main class="content">
      <div class="status" id="status">ニュースを読み込んでいます。</div>
      <section class="news-grid" id="news" aria-live="polite"></section>
    </main>

    <template id="category-template">
      <article class="category-panel" role="tabpanel">
        <div class="category-heading">
          <h2></h2>
          <span class="count"></span>
        </div>
        <div class="items"></div>
      </article>
    </template>

    <template id="item-template">
      <a class="news-item" target="_blank" rel="noopener noreferrer">
        <span class="source-row">
          <span class="source"></span>
          <time></time>
        </span>
        <strong></strong>
        <span class="excerpt"></span>
        <span class="read-more"></span>
      </a>
    </template>

    <script src="./app.js" defer></script>
  </body>
</html>
