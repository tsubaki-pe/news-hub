name: Update RSS news

on:
  schedule:
    # 06:00 Asia/Tokyo is 21:00 UTC on the previous day.
    - cron: "0 21 * * *"
    # 18:00 Asia/Tokyo is 09:00 UTC on the same day.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      use_existing_news:
        description: "Skip RSS/Gemini fetch and deploy the repository news.json"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch RSS feeds
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.use_existing_news != true }}
        run: python scripts/fetch_feeds.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRANSLATION_LIMIT_PER_CATEGORY: "10"
          TRANSLATION_DELAY_SECONDS: "70"

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build public site
        run: python scripts/build_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
